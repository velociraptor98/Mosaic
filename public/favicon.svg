<!-- Mosaic mark, solid cut. Below 16px the two open tiles fill solid — the
     identity sheet calls that "the favicon and app-icon cut". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 28 28" width="32" height="32">
  <rect x="-1" y="-1" width="28" height="28" fill="#f2f2f3"/>
  <g fill="#5980a6">
    <rect x="0" y="0" width="8" height="8"/>
    <rect x="0" y="9" width="8" height="8"/>
    <rect x="0" y="18" width="8" height="8"/>
    <rect x="9" y="0" width="8" height="8"/>
    <rect x="18" y="0" width="8" height="8"/>
    <rect x="18" y="9" width="8" height="8"/>
    <rect x="18" y="18" width="8" height="8"/>
  </g>
</svg>
